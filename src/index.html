<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
  <title>Rain Alarm</title>
  <link rel="stylesheet" href="shell.css">
  <script src="shell.js" defer></script>
</head>
<body>
  <header>
    <div class="controls">
      <strong>Rain Alarm <span>Maps</span></strong>
      <label for="map">Map</label>
      <select id="map" disabled aria-label="Choose a map"></select>
      <button id="reload" type="button" disabled>Reload</button>
    </div>
    <div class="details">
      <p id="description">Weather and hazards, in one place.</p>
      <p id="status" role="status" aria-live="polite">Starting…</p>
    </div>
  </header>
</body>
</html>
